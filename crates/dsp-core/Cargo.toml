[package]
name = "kryx-dsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Audio DSP processing stages for the Kryx ecosystem (@kryxjs/dsp)"

[dependencies]
# Kryx core: the Stage trait, MediaBuffer, pipeline. Resolved from the public
# kryx-core repo so the package builds standalone (CI, publish) with no sibling
# checkout. To hack on kc-core alongside dsp, add a [patch] to the root
# Cargo.toml pointing at a local checkout (see README).
kc-core = { git = "https://github.com/Brashkie/kryx-core" }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"
